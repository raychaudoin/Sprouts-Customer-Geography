[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "sprouts-customer-geography"
version = "0.1.0"
description = "Repository-safe public-data geography preparation for Sprouts Customer Geography"
requires-python = ">=3.11"
dependencies = [
    "pyproj>=3.7,<4",
    "shapely>=2.1,<3",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
pipe01-freeze = "sprouts_customer_geography.pipe01.cli:main"
pipe02-bind = "sprouts_customer_geography.pipe02.cli:main"
pipe03-bind = "sprouts_customer_geography.pipe03.cli:main"
model10-reconcile = "sprouts_customer_geography.model10.cli:main"
pipe04-bind = "sprouts_customer_geography.pipe04.cli:main"
model09-develop = "sprouts_customer_geography.model09.cli:main"
model09-bootstrap-registry = "sprouts_customer_geography.model09.registry_bootstrap:main"
data03-materialize = "sprouts_customer_geography.data03.cli:main"
data04-materialize = "sprouts_customer_geography.data04.cli:main"
model11-develop = "sprouts_customer_geography.model11.cli:main"
model11-bootstrap-registry = "sprouts_customer_geography.model11.registry_bootstrap:main"
geo05-spatial = "sprouts_customer_geography.geo05.cli:main"
model12-score = "sprouts_customer_geography.model12.cli:main"
model12-bootstrap-registry = "sprouts_customer_geography.model12.registry_bootstrap:main"
pipe05-bind = "sprouts_customer_geography.pipe05.cli:main"
pipe05-bootstrap-registry = "sprouts_customer_geography.pipe05.registry_bootstrap:main"
model13-run = "sprouts_customer_geography.model13.cli:main"
model13-bootstrap-registry = "sprouts_customer_geography.model13.registry_bootstrap:main"
