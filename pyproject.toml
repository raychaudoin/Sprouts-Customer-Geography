[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "sprouts-customer-geography"
version = "0.1.0"
description = "Repository-safe public-data geography preparation for Sprouts Customer Geography"
requires-python = ">=3.11"
dependencies = [
    "pyproj>=3.7,<4",
    "shapely>=2.1,<3",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
pipe01-freeze = "sprouts_customer_geography.pipe01.cli:main"
pipe02-bind = "sprouts_customer_geography.pipe02.cli:main"
pipe03-bind = "sprouts_customer_geography.pipe03.cli:main"
model10-reconcile = "sprouts_customer_geography.model10.cli:main"
pipe04-bind = "sprouts_customer_geography.pipe04.cli:main"
model09-develop = "sprouts_customer_geography.model09.cli:main"
model09-bootstrap-registry = "sprouts_customer_geography.model09.registry_bootstrap:main"
