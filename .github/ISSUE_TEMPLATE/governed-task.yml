name: Governed task coordination
description: Disclosure-safe derivative cockpit for an already-authorized governed task.
title: "<TASK-ID>: <Short Action>"
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Use one exact-identity Issue only for an already-authorized task when public disclosure is safe.
        This Issue is derivative coordination evidence only. It does not authorize work, create acceptance, or override repository authority.
        Do not create an Issue when even an opaque public posture would reveal protected information.
        Never include protected paths, values, coordinates, nonces, digests, registries, workbook data, target identities, or full reports/transcripts.
        No Issue synchronization, mirrored authority system, bot, or lifecycle automation is authorized.
  - type: input
    id: task_id
    attributes:
      label: Immutable task ID
      placeholder: GOV-02
    validations:
      required: true
  - type: dropdown
    id: lane
    attributes:
      label: Assigned lane
      description: Use the lane assigned by Master Control Room; ambiguity requires Lane B.
      options:
        - Lane A — routine technical
        - Lane B — capability-sensitive
    validations:
      required: true
  - type: input
    id: acceptance_owner
    attributes:
      label: Acceptance owner / destination
      placeholder: "GOV: Repository Workflow Decisions & Acceptance"
    validations:
      required: true
  - type: textarea
    id: objective_scope
    attributes:
      label: Concise objective, scope, and exclusions
      description: Repository-safe summary only; do not copy a full authorization or report.
    validations:
      required: true
  - type: input
    id: manifest
    attributes:
      label: Repository task-manifest path
      placeholder: governance/tasks/GOV-02.example.task.json
    validations:
      required: true
  - type: textarea
    id: posture_decision_transition
    attributes:
      label: Current posture, decision needed, and next manual transition
      description: Keep this current and disclosure-safe; link PR/CI evidence when available. When blocked, record the blocker class (Recoverable execution, Access, or Authority), the exact blocked condition, and the exact user action or owner decision needed. State that no user action is needed for a recoverable execution blocker.
    validations:
      required: true
