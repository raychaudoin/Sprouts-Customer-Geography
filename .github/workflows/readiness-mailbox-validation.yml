name: Readiness Mailbox Validation

on:
  push:
    branches:
      - readiness-mailbox

permissions:
  contents: read

jobs:
  readiness-mailbox-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python -m pip install .
      - run: python scripts/check_readiness_mailbox.py
