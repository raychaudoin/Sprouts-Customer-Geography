name: Repository Validation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  repository-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python -m pip install .
      - run: python scripts/check_governance_repository.py
      - run: python scripts/check_pipe01_repository.py
      - run: python scripts/check_pipe02_repository.py
      - run: python scripts/check_pipe03_repository.py
      - run: python scripts/check_model10_repository.py
      - run: python -m unittest discover -s tests -v
        env:
          PIPE01_TEST_TEMP_ROOT: ${{ runner.temp }}
