name: Repository Validation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  repository-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python -m pip install .
      - run: python scripts/check_governance_repository.py
      - run: python scripts/check_pipe01_repository.py
      - run: python scripts/check_pipe02_repository.py
      - run: python scripts/check_pipe03_repository.py
      - run: python scripts/check_model10_repository.py
      - run: python scripts/check_pipe04_repository.py
      - run: python scripts/check_model09_repository.py
      - run: python scripts/check_data03_repository.py
      - run: python scripts/check_data04_repository.py
      - run: python scripts/check_geo05_repository.py
      - run: python scripts/check_model11_repository.py
      - run: python scripts/check_model12_repository.py
      - run: python scripts/check_pipe05_repository.py
      - run: python scripts/check_model13_repository.py
      - run: python scripts/check_pbi01_repository.py
      - run: python scripts/check_arch01_repository.py
      - run: python -m unittest discover -s tests -v
        env:
          PIPE01_TEST_TEMP_ROOT: ${{ runner.temp }}
          MODEL09_TEST_TEMP_ROOT: ${{ runner.temp }}
          DATA03_TEST_TEMP_ROOT: ${{ runner.temp }}
          DATA04_TEST_TEMP_ROOT: ${{ runner.temp }}
          GEO05_TEST_TEMP_ROOT: ${{ runner.temp }}
          MODEL11_TEST_TEMP_ROOT: ${{ runner.temp }}
          MODEL12_TEST_TEMP_ROOT: ${{ runner.temp }}
          MODEL13_TEST_TEMP_ROOT: ${{ runner.temp }}
          PBI01_TEST_TEMP_ROOT: ${{ runner.temp }}
